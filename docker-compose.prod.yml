# Production stack for the homelab. Run from the backend repo directory:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Expects the frontend repo cloned as a sibling: ../platform-politics-frontend
# External access is via the user's Cloudflare Tunnel pointing at:
#   api.<domain> -> http://<host>:8082   (nginx)
#   app.<domain> -> http://<host>:8083   (frontend)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-politics_platform}
      POSTGRES_USER: ${DB_USERNAME:-politics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [politics_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-politics} -d ${DB_DATABASE:-politics_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [politics_net]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: politics-backend:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [politics_net]
    # CMD (php-fpm) inherited from image; entrypoint runs migrate + seed here.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [politics_net]

  queue:
    image: politics-backend:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [politics_net]

  scheduler:
    image: politics-backend:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [politics_net]

  frontend:
    build:
      context: ../platform-politics-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
    image: politics-frontend:latest
    restart: unless-stopped
    ports:
      - "8083:80"
    networks: [politics_net]

networks:
  politics_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
