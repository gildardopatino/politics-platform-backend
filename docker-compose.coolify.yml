services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-politics_platform}
      POSTGRES_USER: ${DB_USERNAME:-politics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [politics_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-politics} -d ${DB_DATABASE:-politics_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [politics_net]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: politics-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-politics_platform}
      DB_USERNAME: ${DB_USERNAME:-politics}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [politics_net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [politics_net]

  queue:
    image: politics-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-politics_platform}
      DB_USERNAME: ${DB_USERNAME:-politics}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [politics_net]

  scheduler:
    image: politics-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-politics_platform}
      DB_USERNAME: ${DB_USERNAME:-politics}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [politics_net]

networks:
  politics_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
